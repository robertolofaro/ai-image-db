[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-provenance"
version = "0.1.0"
description = "Load AI image metadata (ComfyUI/A1111), C2PA, watermarks into SQLite; caption with Florence-2 + WD tagger; audit for EU AI Act Art. 50"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "piexif>=1.1.3",
    "tqdm",
    "click",
    "python-dateutil",
    "numpy",
]

[project.optional-dependencies]
c2pa = ["c2pa-python>=0.30.0"]
caption = [
    "torch>=2.0.0",
    "torchvision",
    "transformers>=4.40.0",
    "timm",
    "einops",
    "huggingface_hub",
    "onnxruntime",
    "pandas",
]
all = ["ai-image-provenance[c2pa,caption]"]

[project.scripts]
ai-image-db = "ai_image_db.cli:main"

[tool.setuptools.packages.find]
include = ["ai_image_db*"]
